  <rect x="505" y="78" width="355" height="285" fill="#F0FDF4"/>
  <rect x="150" y="363" width="355" height="285" fill="#FFF1F2"/>
  <rect x="505" y="363" width="355" height="285" fill="#FFFBEB"/>

