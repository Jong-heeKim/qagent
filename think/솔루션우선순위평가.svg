  <text x="530" y="62" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="12" fill="#64748B">AI Agent 품질 측정 플랫폼 · 비즈니스 영향도(B) × 실현 가능성(F) · 원 크기 = 총 투표수</text>

  <!-- Quadrant backgrounds: chart x:150-860, y:78-648, center X=505, Y=363 -->
