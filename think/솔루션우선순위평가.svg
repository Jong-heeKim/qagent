  <text x="520" y="103" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="bold" fill="#15803D">No Brainers</text>
  <text x="520" y="120" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#86EFAC">실현가능성 높음 · 비즈니스 영향도 높음</text>
  <text x="687" y="220" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#BBF7D0" font-style="italic">(해당 없음)</text>

  <text x="165" y="390" font-family="'Segoe UI',Arial,sans-serif" font-size="15" font-weight="bold" fill="#DC2626">Unwise</text>
