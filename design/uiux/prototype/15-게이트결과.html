<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>15 게이트결과 — QaAgent</title>
<link rel="stylesheet" href="common.css?v=2">
<style>
.filter-bar { display:flex; gap:6px; padding:10px 16px; background:var(--slate-50); border-bottom:1px solid var(--border); overflow-x:auto; }
.filter-bar select { font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--card-bg); color:var(--text); min-width:80px; flex-shrink:0; }
.gate-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:8px; cursor:pointer; transition:border-color .15s; }
.gate-card.fail { border-color:var(--red); border-width:1.5px; }
.gate-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
.gate-result { font-size:15px; font-weight:800; margin-bottom:6px; }
.gate-result.pass { color:var(--green-text); }
.gate-result.fail { color:var(--red-text); }
.gate-meta { font-size:12px; color:var(--text-3); }

.drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:none; }
.drawer-overlay.open { display:block; }
.drawer { position:absolute; bottom:0; left:0; right:0; background:var(--card-bg); border-radius:16px 16px 0 0; padding:20px 16px 32px; max-height:80%; overflow-y:auto; }
.drawer-handle { width:40px; height:4px; background:var(--border-2); border-radius:2px; margin:0 auto 16px; }
.drawer-title { font-size:16px; font-weight:700; color:var(--text); margin-bottom:4px; }
.drawer-sub { font-size:12px; color:var(--text-3); margin-bottom:16px; }
.violation-box { background:var(--red-bg); border:1px solid var(--red); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
.viol-metric { font-size:14px; font-weight:700; color:var(--red-text); margin-bottom:8px; }
.viol-row { display:flex; gap:16px; font-size:12px; color:var(--red-text); flex-wrap:wrap; margin-bottom:6px; }
.viol-row span { font-family:var(--font-mono); font-weight:700; }
.block-reason { font-size:12px; color:var(--text-2); background:var(--slate-50); padding:10px; border-radius:6px; font-style:italic; margin-top:8px; }

.pass-box { background:var(--green-bg); border:1px solid var(--green); border-radius:var(--radius); padding:14px; margin-bottom:12px; }
</style>
</head>
<body>
<nav class="proto-nav" id="protoNav"></nav>
<div class="phone-frame">
  <div class="screen">
    <div class="page-header">
      <a class="back-btn" href="03-메인대시보드.html">‹</a>
      <span class="page-header-title">게이트 결과</span>
    </div>

    <!-- 필터 바 -->
    <div class="filter-bar">
      <select id="filterAgent" onchange="applyFilter()">
        <option value="">에이전트 전체</option>
        <option value="챗봇-A">챗봇-A</option>
        <option value="RAG-B">RAG-B</option>
      </select>
      <select id="filterResult" onchange="applyFilter()">
        <option value="">결과 전체</option>
        <option value="pass">Pass</option>
        <option value="fail">Fail</option>
      </select>
    </div>

    <div class="content" style="padding-top:8px;">
      <div id="gateList"></div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <a class="nav-item" href="03-메인대시보드.html"><span class="nav-icon">🏠</span>홈</a>
      <a class="nav-item" href="04-에이전트목록.html"><span class="nav-icon">🤖</span>에이전트</a>
      <a class="nav-item" href="08-평가실행.html"><span class="nav-icon">📊</span>평가</a>
      <a class="nav-item" href="#"><span class="nav-icon">⚙️</span>더보기</a>
    </div>

    <!-- Fail 상세 드로어 -->
    <div class="drawer-overlay" id="failDrawer" onclick="if(event.target===this)closeDrawer('failDrawer')">
      <div class="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-title">게이트 차단 상세</div>
        <div class="drawer-sub">PR #123 · 커밋: a1b2c3d · 소요: 2분 15초 · ❌ Fail</div>
        <div class="violation-box">
          <div class="viol-metric">Faithfulness</div>
          <div class="viol-row">
            <span>현재: 0.74</span>
            <span>기준: 0.80</span>
            <span style="color:var(--red-text);">차이: -0.06</span>
          </div>
          <div class="viol-row"><span>이전 평가: 0.82</span></div>
          <div class="block-reason">"0.82→0.74로 하락, 기준 0.80 미달로 배포가 보류되었습니다."</div>
        </div>
        <button class="btn btn-secondary btn-md btn-full" onclick="closeDrawer('failDrawer')">닫기</button>
      </div>
    </div>

    <!-- Pass 상세 드로어 -->
    <div class="drawer-overlay" id="passDrawer" onclick="if(event.target===this)closeDrawer('passDrawer')">
      <div class="drawer">
        <div class="drawer-handle"></div>
        <div class="drawer-title">게이트 통과 상세</div>
        <div class="drawer-sub" id="passDrawerSub"></div>
        <div class="pass-box">
          <div style="font-size:15px; font-weight:700; color:var(--green-text); margin-bottom:8px;">✅ 모든 지표 기준 충족</div>
          <div style="font-size:12px; color:var(--green-text);">Faithfulness / AnswerRelevancy / ContextRecall — 모두 임계값 이상</div>
        </div>
        <button class="btn btn-secondary btn-md btn-full" onclick="closeDrawer('passDrawer')">닫기</button>
      </div>
    </div>
  </div>
</div>

<script src="common.js?v=2"></script>
<script>
renderProtoNav('15-게이트결과.html');

function openDrawer(id)  { document.getElementById(id).classList.add('open'); }
function closeDrawer(id) { document.getElementById(id).classList.remove('open'); }

function renderList(list) {
  const el = document.getElementById('gateList');
  if (!list.length) {
    el.innerHTML = '<div style="text-align:center;padding:40px 0;font-size:14px;color:var(--text-3);">조회된 게이트 결과가 없습니다</div>';
    return;
  }
  el.innerHTML = list.map(g => {
    const isPass = g.result === 'pass';
    const icon = isPass ? '✅' : '❌';
    const label = isPass ? 'Pass' : 'Fail';
    const resultCls = isPass ? 'pass' : 'fail';
    const onClick = isPass
      ? `onclick="document.getElementById('passDrawerSub').textContent='PR #${g.pr} · 커밋: ${g.commit} · 소요: ${g.elapsed}'; openDrawer('passDrawer')"`
      : `onclick="openDrawer('failDrawer')"`;
    return `
    <div class="gate-card ${resultCls}" ${onClick}>
      <div class="gate-result ${resultCls}">${icon} ${label} · PR #${g.pr}</div>
      <div class="gate-meta">커밋: <span style="font-family:var(--font-mono);">${g.commit}</span> · ${g.agent}</div>
      <div class="gate-meta">${g.date} · 소요: ${g.elapsed}</div>
    </div>`;
  }).join('');
}

function applyFilter() {
  const agent  = document.getElementById('filterAgent').value;
  const result = document.getElementById('filterResult').value;
  const list = SAMPLE.gateResults.filter(g => {
    if (agent  && g.agent  !== agent)  return false;
    if (result && g.result !== result) return false;
    return true;
  });
  renderList(list);
}

applyFilter();
</script>
</body>
</html>
