<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>04 에이전트목록 — QaAgent</title>
<link rel="stylesheet" href="common.css?v=2">
</head>
<body>
<nav class="proto-nav" id="protoNav"></nav>
<div class="phone-frame">
  <div class="screen">
    <div class="page-header">
      <span class="page-header-title">에이전트 관리</span>
      <a href="05-에이전트등록.html" class="btn btn-primary btn-sm">+ 등록</a>
    </div>

    <div class="content-scroll">
      <!-- 챗봇-A -->
      <a href="06-에이전트상세설정.html" style="text-decoration:none;">
        <div class="agent-card" style="border-radius:0; margin-bottom:0; border-left:none; border-right:none; border-top:none;">
          <div class="agent-card-header">
            <span class="traffic-dot dot-green"></span>
            <div style="flex:1;">
              <div class="agent-card-name">챗봇-A</div>
              <div class="agent-card-sub">RAG · 마지막 평가: 2시간 전</div>
            </div>
            <span class="badge badge-green"><span class="badge-dot dot-green"></span>정상</span>
            <span style="color:var(--border-2); margin-left:6px;">›</span>
          </div>
          <div style="padding:0 16px 12px; display:flex; gap:8px;">
            <span class="type-badge">RAG</span>
            <span style="font-size:12px; color:var(--text-3); line-height:20px; font-family:var(--font-mono);">chat-api.company.ai</span>
          </div>
        </div>
      </a>
      <div class="divider-line"></div>

      <!-- RAG-B -->
      <a href="06-에이전트상세설정.html" style="text-decoration:none;">
        <div class="agent-card" style="border-radius:0; margin-bottom:0; border-left:none; border-right:none; border-top:none;">
          <div class="agent-card-header">
            <span class="traffic-dot dot-yellow"></span>
            <div style="flex:1;">
              <div class="agent-card-name">RAG-B</div>
              <div class="agent-card-sub">RAG · 마지막 평가: 1일 전</div>
            </div>
            <span class="badge badge-yellow"><span class="badge-dot dot-yellow"></span>경고</span>
            <span style="color:var(--border-2); margin-left:6px;">›</span>
          </div>
          <div style="padding:0 16px 12px; display:flex; gap:8px; justify-content:space-between; align-items:center;">
            <div style="display:flex; gap:8px;">
              <span class="type-badge">RAG</span>
              <span style="font-size:12px; color:var(--text-3); line-height:20px; font-family:var(--font-mono);">rag-api.company.ai</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="event.preventDefault(); openModal('deleteModal')">삭제</button>
          </div>
        </div>
      </a>
      <div class="divider-line"></div>

      <!-- 검색-C (오류) -->
      <a href="06-에이전트상세설정.html" style="text-decoration:none;">
        <div class="agent-card" style="border-radius:0; margin-bottom:0; border-left:none; border-right:none; border-top:none; opacity:0.75;">
          <div class="agent-card-header">
            <span class="traffic-dot dot-gray"></span>
            <div style="flex:1;">
              <div class="agent-card-name">검색-C</div>
              <div class="agent-card-sub">검색증강 · 마지막 평가: 5일 전</div>
            </div>
            <span class="badge badge-gray"><span class="badge-dot dot-gray"></span>비활성</span>
            <span style="color:var(--border-2); margin-left:6px;">›</span>
          </div>
          <div style="padding:0 16px 12px; display:flex; gap:8px; justify-content:space-between; align-items:center;">
            <div style="display:flex; gap:8px;">
              <span class="type-badge">검색증강</span>
              <span style="font-size:12px; color:var(--text-3); line-height:20px; font-family:var(--font-mono);">search-api.company.ai</span>
            </div>
            <button class="btn btn-danger btn-sm" onclick="event.preventDefault(); openModal('deleteModal')">삭제</button>
          </div>
        </div>
      </a>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <a class="nav-item" href="03-메인대시보드.html"><span class="nav-icon">🏠</span>홈</a>
      <a class="nav-item active" href="04-에이전트목록.html"><span class="nav-icon">🤖</span>에이전트</a>
      <a class="nav-item" href="08-평가실행.html"><span class="nav-icon">📊</span>평가</a>
      <a class="nav-item" href="#"><span class="nav-icon">⚙️</span>더보기</a>
    </div>

    <!-- 삭제 확인 모달 -->
    <div class="modal-center" id="deleteModal">
      <div class="modal-box">
        <div class="modal-title">에이전트 삭제</div>
        <p style="font-size:14px; color:var(--text-2); margin-bottom:8px;">RAG-B를 삭제하시겠습니까?</p>
        <p style="font-size:13px; color:var(--text-3); background:var(--slate-50); padding:10px; border-radius:8px; margin-bottom:16px;">
          ℹ 연관 평가 이력은 삭제 후에도 보존됩니다.
        </p>
        <div style="display:flex; gap:8px;">
          <button class="btn btn-secondary btn-md" style="flex:1;" onclick="closeModal('deleteModal')">취소</button>
          <button class="btn btn-danger btn-md" style="flex:1;" onclick="closeModal('deleteModal'); showToast('삭제되었습니다','success')">삭제</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="common.js?v=2"></script>
<script>renderProtoNav('04-에이전트목록.html');</script>
</body>
</html>
