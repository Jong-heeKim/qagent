<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>02 회원가입 — QaAgent</title>
<link rel="stylesheet" href="common.css?v=3">
<style>
.signup-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 32px 24px;
  background: var(--surface);
}
.signup-logo { text-align: center; margin-bottom: 24px; }
.signup-logo-title { font-size: 18px; font-weight: 900; color: var(--primary); }
.signup-logo-sub { font-size: 13px; color: var(--text-3); }
.signup-footer { text-align: center; padding: 16px 24px 24px; font-size: 13px; color: var(--text-3); background: var(--surface); }
.signup-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
.email-status { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; }
</style>
</head>
<body>
<nav class="proto-nav" id="protoNav"></nav>
<div class="phone-frame">
  <div class="screen">
    <div class="signup-wrap">
      <div class="signup-logo">
        <div class="signup-logo-title">🤖 QaAgent</div>
        <div class="signup-logo-sub">새 계정 만들기</div>
      </div>

      <!-- 이름 -->
      <div class="form-group">
        <label class="label label-required" for="name">이름</label>
        <input class="input-field" id="name" type="text" placeholder="홍길동" value="">
        <div class="input-error" id="nameError">2자 이상 입력해 주세요</div>
      </div>

      <!-- 이메일 -->
      <div class="form-group">
        <label class="label label-required" for="signupEmail">이메일</label>
        <div class="input-wrapper">
          <input class="input-field" id="signupEmail" type="email" placeholder="이메일 주소">
          <span class="email-status" id="emailStatus"></span>
        </div>
        <div class="input-error" id="emailError">이미 사용 중인 이메일입니다</div>
      </div>

      <!-- 비밀번호 -->
      <div class="form-group">
        <label class="label label-required" for="signupPw">비밀번호</label>
        <div class="input-wrapper">
          <input class="input-field" id="signupPw" type="password" placeholder="8자 이상">
          <span class="input-eye" id="eyeToggle">👁</span>
        </div>
        <!-- 강도 바 -->
        <div class="pw-strength" id="pwStrength">
          <div class="pw-strength-bar" id="bar1"></div>
          <div class="pw-strength-bar" id="bar2"></div>
          <div class="pw-strength-bar" id="bar3"></div>
          <div class="pw-strength-bar" id="bar4"></div>
        </div>
        <div class="pw-strength-label" id="pwStrengthLabel">비밀번호를 입력하세요</div>
      </div>

      <!-- 역할 -->
      <div class="form-group">
        <label class="label label-required" for="role">역할</label>
        <select class="input-field" id="role">
          <option value="">역할 선택</option>
          <option value="ml">ML 엔지니어</option>
          <option value="qa">AI 품질 엔지니어</option>
          <option value="pm">PM · 기획자</option>
          <option value="dev">개발자</option>
        </select>
      </div>

      <button class="btn btn-primary btn-xl" id="signupBtn" disabled style="margin-top:4px;">가입하기</button>
    </div>

    <div class="signup-footer">
      이미 계정이 있으신가요? <a href="01-로그인.html">로그인</a>
    </div>
  </div>
</div>

<script src="common.js?v=3"></script>
<script>
renderProtoNav('02-회원가입.html');

// 비밀번호 토글
document.getElementById('eyeToggle').addEventListener('click', () => {
  const pw = document.getElementById('signupPw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

// 비밀번호 강도
document.getElementById('signupPw').addEventListener('input', function() {
  const v = this.value;
  let strength = 0;
  if (v.length >= 8) strength++;
  if (/[A-Z]/.test(v)) strength++;
  if (/[0-9]/.test(v)) strength++;
  if (/[^A-Za-z0-9]/.test(v)) strength++;

  const bars = ['bar1','bar2','bar3','bar4'];
  const colors = ['#EF4444','#FBBF24','#22C55E','#2563EB'];
  const labels = ['','약함','보통','강함','매우 강함'];
  bars.forEach((id, i) => {
    document.getElementById(id).style.background = i < strength ? colors[strength - 1] : 'var(--border)';
  });
  document.getElementById('pwStrengthLabel').textContent = labels[strength] || '비밀번호를 입력하세요';
  checkForm();
});

// 이메일 중복 확인 (시뮬레이션)
let emailTimer;
document.getElementById('signupEmail').addEventListener('blur', function() {
  clearTimeout(emailTimer);
  emailTimer = setTimeout(() => {
    if (this.value === 'taken@company.ai') {
      document.getElementById('emailStatus').textContent = '✗';
      document.getElementById('emailStatus').style.color = 'var(--red)';
      document.getElementById('emailError').classList.add('show');
    } else if (this.value.includes('@')) {
      document.getElementById('emailStatus').textContent = '✓';
      document.getElementById('emailStatus').style.color = 'var(--green)';
      document.getElementById('emailError').classList.remove('show');
    }
    checkForm();
  }, 500);
});

// 이름 검증
document.getElementById('name').addEventListener('input', function() {
  if (this.value.length < 2 && this.value.length > 0) {
    document.getElementById('nameError').classList.add('show');
  } else {
    document.getElementById('nameError').classList.remove('show');
  }
  checkForm();
});

document.getElementById('role').addEventListener('change', checkForm);

function checkForm() {
  const name = document.getElementById('name').value.length >= 2;
  const email = document.getElementById('signupEmail').value.includes('@');
  const pw = document.getElementById('signupPw').value.length >= 8;
  const role = document.getElementById('role').value !== '';
  document.getElementById('signupBtn').disabled = !(name && email && pw && role);
}

// 가입하기
document.getElementById('signupBtn').addEventListener('click', () => {
  const btn = document.getElementById('signupBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  setTimeout(() => {
    showToast('회원가입이 완료되었습니다!', 'success');
    setTimeout(() => { window.location.href = '01-로그인.html'; }, 1000);
  }, 800);
});
</script>
</body>
</html>
