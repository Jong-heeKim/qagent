<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 평가이력 — QaAgent</title>
<link rel="stylesheet" href="common.css?v=2">
<style>
.filter-bar { display:flex; gap:6px; padding:10px 16px; background:var(--slate-50); border-bottom:1px solid var(--border); overflow-x:auto; }
.filter-bar select { font-size:12px; padding:6px 8px; border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--card-bg); color:var(--text); min-width:80px; flex-shrink:0; }
.eval-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px; margin-bottom:8px; cursor:pointer; transition:border-color .15s; display:flex; align-items:flex-start; gap:12px; }
.eval-card:hover { border-color:var(--primary-pale); }
.eval-card-body { flex:1; }
.eval-card-title { font-size:14px; font-weight:700; color:var(--text); margin-bottom:2px; display:flex; align-items:center; gap:6px; }
.eval-card-sub { font-size:12px; color:var(--text-3); margin-bottom:8px; }
.metric-chips { display:flex; gap:6px; flex-wrap:wrap; }
.metric-chip { font-size:11px; font-family:var(--font-mono); background:var(--slate-100); color:var(--text-2); padding:2px 6px; border-radius:4px; }
.metric-chip.warn { background:var(--yellow-bg); color:var(--yellow-text); }
.pagination { display:flex; align-items:center; justify-content:center; gap:16px; padding:16px; font-size:13px; color:var(--text-2); }
.page-btn { width:32px; height:32px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--card-bg); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.page-btn:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<nav class="proto-nav" id="protoNav"></nav>
<div class="phone-frame">
  <div class="screen">
    <div class="page-header">
      <a class="back-btn" href="03-메인대시보드.html">‹</a>
      <span class="page-header-title">평가 이력</span>
    </div>

    <!-- 필터 바 -->
    <div class="filter-bar">
      <select id="filterAgent" onchange="applyFilter()">
        <option value="">에이전트 전체</option>
        <option value="챗봇-A">챗봇-A</option>
        <option value="RAG-B">RAG-B</option>
        <option value="검색-C">검색-C</option>
      </select>
      <select id="filterMode" onchange="applyFilter()">
        <option value="">모드 전체</option>
        <option value="전체">전체 모드</option>
        <option value="경량">경량 모드</option>
      </select>
      <select id="filterDate" onchange="applyFilter()">
        <option value="">기간 전체</option>
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
      </select>
    </div>

    <div class="content" style="padding-top:8px;">
      <div id="evalList"></div>

      <!-- 페이지네이션 -->
      <div class="pagination">
        <button class="page-btn" id="prevBtn" disabled onclick="changePage(-1)">‹</button>
        <span id="pageInfo">1 / 1</span>
        <button class="page-btn" id="nextBtn" disabled onclick="changePage(1)">›</button>
      </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <a class="nav-item" href="03-메인대시보드.html"><span class="nav-icon">🏠</span>홈</a>
      <a class="nav-item" href="04-에이전트목록.html"><span class="nav-icon">🤖</span>에이전트</a>
      <a class="nav-item active" href="08-평가실행.html"><span class="nav-icon">📊</span>평가</a>
      <a class="nav-item" href="#"><span class="nav-icon">⚙️</span>더보기</a>
    </div>
  </div>
</div>

<script src="common.js?v=2"></script>
<script>
renderProtoNav('10-평가이력.html');

const PAGE_SIZE = 5;
let page = 1;
let filtered = [];

const testsetCount = { 'testset-v2.csv': 150, 'testset-v1.json': 80 };

function metricWarn(val, threshold) { return val < threshold; }

function renderList() {
  const el = document.getElementById('evalList');
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
  const slice = filtered.slice((page - 1) * PAGE_SIZE, page * PAGE_SIZE);

  if (slice.length === 0) {
    el.innerHTML = '<div style="text-align:center; padding:40px 0; font-size:14px; color:var(--text-3);">조회된 평가 이력이 없습니다</div>';
  } else {
    el.innerHTML = slice.map(ev => {
      const agent = SAMPLE.agents.find(a => a.name === ev.agent);
      const th = agent ? agent.threshold : { f: 0.70, ar: 0.70, cr: 0.70 };
      const fWarn = metricWarn(ev.f, th.f), arWarn = metricWarn(ev.ar, th.ar), crWarn = metricWarn(ev.cr, th.cr);
      const hasFail = fWarn || arWarn || crWarn;
      const cnt = testsetCount[ev.testset] || '-';
      return `
      <div class="eval-card" onclick="window.location.href='09-평가결과.html'">
        <div class="eval-card-body">
          <div class="eval-card-title">
            ${ev.agent}
            <span class="badge ${hasFail ? 'badge-yellow' : 'badge-green'}" style="font-size:10px;">${hasFail ? '경고' : '정상'}</span>
          </div>
          <div class="eval-card-sub">${ev.date} · ${ev.mode}모드 · ${cnt}건 · ${ev.testset}</div>
          <div class="metric-chips">
            <span class="metric-chip ${fWarn ? 'warn' : ''}">F: ${ev.f.toFixed(2)}</span>
            <span class="metric-chip ${arWarn ? 'warn' : ''}">AR: ${ev.ar.toFixed(2)}</span>
            <span class="metric-chip ${crWarn ? 'warn' : ''}">CR: ${ev.cr.toFixed(2)}</span>
          </div>
        </div>
        <span style="color:var(--border-2); font-size:18px; padding-top:4px;">›</span>
      </div>`;
    }).join('');
  }

  document.getElementById('pageInfo').textContent = `${page} / ${totalPages}`;
  document.getElementById('prevBtn').disabled = page <= 1;
  document.getElementById('nextBtn').disabled = page >= totalPages;
}

function applyFilter() {
  const agent = document.getElementById('filterAgent').value;
  const mode  = document.getElementById('filterMode').value;
  filtered = SAMPLE.evalHistory.filter(ev => {
    if (agent && ev.agent !== agent) return false;
    if (mode  && ev.mode  !== mode)  return false;
    return true;
  });
  page = 1;
  renderList();
}

function changePage(delta) {
  page += delta;
  renderList();
}

applyFilter();
</script>
</body>
</html>
