<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 로그인 — QaAgent</title>
<link rel="stylesheet" href="common.css?v=3">
<style>
.login-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 40px 24px;
  background: var(--surface);
}
.login-logo { text-align: center; margin-bottom: 32px; }
.login-logo-icon { font-size: 48px; margin-bottom: 8px; }
.login-logo-title { font-size: 20px; font-weight: 900; color: var(--primary); }
.login-logo-sub { font-size: 13px; color: var(--text-3); margin-top: 4px; }
.login-footer { text-align: center; padding: 20px; font-size: 13px; color: var(--text-3); }
.login-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
.lock-banner {
  background: var(--yellow-bg);
  border: 1px solid var(--yellow);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 13px;
  color: var(--yellow-text);
  margin-bottom: 16px;
  display: none;
}
.lock-banner.show { display: block; }
</style>
</head>
<body>
<nav class="proto-nav" id="protoNav"></nav>
<div class="phone-frame">
  <div class="screen">
    <div class="login-wrap">
      <div class="login-logo">
        <div class="login-logo-icon">🤖</div>
        <div class="login-logo-title">QaAgent</div>
        <div class="login-logo-sub">AI Agent 품질 검증 플랫폼</div>
      </div>

      <!-- 잠금 배너 (5회 실패 시) -->
      <div class="lock-banner" id="lockBanner">
        ⚠ 5회 연속 실패로 계정이 30분간 잠겼습니다
      </div>

      <div class="form-group">
        <label class="label" for="email">이메일</label>
        <input class="input-field" id="email" type="email" placeholder="이메일 주소" value="hong@company.ai">
        <div class="input-error" id="emailError">이메일 형식이 올바르지 않습니다</div>
      </div>
      <div class="form-group">
        <label class="label" for="pw">비밀번호</label>
        <div class="input-wrapper">
          <input class="input-field" id="pw" type="password" placeholder="비밀번호" value="password123">
          <span class="input-eye" id="eyeToggle">👁</span>
        </div>
        <div class="input-error" id="pwError">이메일 또는 비밀번호가 올바르지 않습니다</div>
      </div>

      <button class="btn btn-primary btn-xl" id="loginBtn" style="margin-top:8px;">로그인</button>
      <!-- 실패 시뮬레이션 버튼 -->
      <button class="btn btn-ghost btn-md btn-full" id="failBtn" style="margin-top:8px; font-size:12px; color: var(--text-3);">❌ 로그인 실패 시뮬레이션</button>
    </div>

    <div class="login-footer">
      계정이 없으신가요? <a href="02-회원가입.html">회원가입</a>
    </div>
  </div>
</div>

<script src="common.js?v=3"></script>
<script>
renderProtoNav('01-로그인.html');

// 비밀번호 토글
document.getElementById('eyeToggle').addEventListener('click', () => {
  const pw = document.getElementById('pw');
  pw.type = pw.type === 'password' ? 'text' : 'password';
});

// 로그인 성공
document.getElementById('loginBtn').addEventListener('click', () => {
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div>';
  setTimeout(() => {
    window.location.href = '03-메인대시보드.html';
  }, 800);
});

// 로그인 실패 시뮬레이션
document.getElementById('failBtn').addEventListener('click', () => {
  document.getElementById('pwError').classList.add('show');
  document.getElementById('pw').classList.add('error');
  setTimeout(() => {
    document.getElementById('lockBanner').classList.add('show');
  }, 2000);
});

// Enter 키
document.getElementById('pw').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
</script>
</body>
</html>
